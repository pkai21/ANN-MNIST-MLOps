name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout source code
      # ============================================================

      - name: Checkout code
        uses: actions/checkout@v4


      # ============================================================
      # 2. Setup Python
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # 3. Install dependencies
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          # PyTorch CPU
          python -m pip install \
            torch==2.14.0 \
            torchvision==0.29.0 \
            --index-url https://download.pytorch.org/whl/cpu

          # Application and testing dependencies
          python -m pip install \
            fastapi \
            uvicorn \
            requests \
            pytest==8.4.2


      # ============================================================
      # 4. Run model unit tests
      # ============================================================

      - name: Run model tests
        run: |
          python -m pytest tests/test_model.py


      # ============================================================
      # 5. Train model
      # ============================================================

      - name: Train model
        run: |
          python src/train.py


      # ============================================================
      # 6. Verify trained model exists
      # ============================================================

      - name: Verify trained model
        run: |
          echo "Checking trained model..."

          test -f models/ann_mnist.pth

          echo "Model file:"
          ls -lh models/ann_mnist.pth


      # ============================================================
      # 7. Start FastAPI server
      # ============================================================

      - name: Start API server
        run: |
          python -m uvicorn src.api:app \
            --host 127.0.0.1 \
            --port 8000 \
            > api.log 2>&1 &

          python -c "import time; time.sleep(5)"


      # ============================================================
      # 8. Check API health
      # ============================================================

      - name: Check API server
        run: |
          curl --fail http://127.0.0.1:8000/health


      # ============================================================
      # 9. Run API tests
      # ============================================================

      - name: Run API tests
        run: |
          python -m pytest tests/test_api.py


      # ============================================================
      # 10. Evaluate model
      # ============================================================

      - name: Evaluate model
        run: |
          python src/evaluate.py


      # ============================================================
      # 11. Show API log if job fails
      # ============================================================

      - name: Show API log
        if: failure()
        run: |
          echo "================ API LOG ================"
          cat api.log || true


      # ============================================================
      # 12. Upload model artifact
      # ============================================================

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ann-mnist-model-${{ github.sha }}
          path: |
            models/ann_mnist.pth
            models/model_metadata.json